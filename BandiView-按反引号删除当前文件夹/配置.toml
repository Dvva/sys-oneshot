# ============================================================
# BandiView 删除文件夹 —— 配置
#
# 改完重跑一次「应用.cmd」生效（已生效的部分会跳过，不会重复装）。
# 想确认改没改到：.\应用.ps1 -Detect，退出码 0 = 已按这份配置生效。
# ============================================================

[快捷键]
# 触发键的虚拟键码（十六进制小写）。
# 默认 c0 = 反引号 ` 键
#
# 其他常用：
#   c0 = `      c1 = 空格左边那个键    dc = 反斜杠 \
#   bb = 等号 =  bc = 逗号 ,          be = 句号 .
#   bf = 斜杠 /  ba = 分号 ;          db = 左方括号 [
# 完整对照搜 "Virtual-Key Codes"，取十六进制码的小写形式。
按键码 = "c0"

# 写进注册表的槽位（整数 0-35）。
# 按了没反应，多半是这个槽位已经被 BandiView 的其它快捷键占了 ——
# 换个没用过的数字（比如 35、33）再跑一次 应用.cmd。
槽位 = 34
